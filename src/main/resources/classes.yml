# Classes Configuration
# Add new classes here - they will be automatically loaded
# awakened-class: the class the player transforms into after awakening at level 60
# Stat scaling: health-per-level, damage-per-level, defense-per-level, mana-per-level
#   Final stat at level N = base + (per-level * (N - 1))

classes:
