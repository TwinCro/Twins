  warrior:
    display-name: "&cWarrior"
    description: "A mighty melee fighter with high health and defense"
    max-health: 40
    base-damage: 8
    base-defense: 5
    base-mana: 20
    health-per-level: 2.0
    damage-per-level: 1.2
    defense-per-level: 0.8
    mana-per-level: 0.5
    skills:
      - id: warrior_slash
        unlock-level: 1
      - id: warrior_shield_bash
        unlock-level: 5
      - id: warrior_war_cry
        unlock-level: 15
      - id: warrior_whirlwind
        unlock-level: 30
      - id: warrior_earthquake
