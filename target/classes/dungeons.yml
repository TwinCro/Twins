# Dungeons Configuration
# rank: COMMON, UNCOMMON, RARE, EPIC, LEGENDARY
# boss: the boss entity configuration
# mobs: waves of mobs that spawn before the boss
# loot: chest loot configuration (3 chests spawn after boss is defeated)
# defense: reduces physical damage; magic-defense: reduces magic damage
# Difficulty scales automatically with player count:
#   HP x (1 + 0.5*(players-1)), DMG x (1 + 0.3*(players-1)), DEF x (1 + 0.2*(players-1))

dungeons:
  skeleton_crypt:
    display-name: "&fSkeleton Crypt"
    rank: COMMON
    min-level: 1
    max-players: 5
    spawn-world: world
    spawn-x: 0
    spawn-y: 64
    spawn-z: 0
    boss:
      type: SKELETON
      name: "&fSkeleton King"
      health: 500
      damage: 20
      defense: 15
      magic-defense: 10
    mobs:
      - type: SKELETON
        count: 8
        health: 120
        damage: 12
        defense: 5
        magic-defense: 5
      - type: ZOMBIE
        count: 4
        health: 150
        damage: 10
        defense: 8
        magic-defense: 3
    loot:
      chest-count: 3
      table:
        - item-id: common_sword
          chance: 40
        - item-id: common_helmet
          chance: 30
        - item-id: common_chestplate
          chance: 30
        - item-id: uncommon_sword
          chance: 10
        - item-id: key_skeleton_crypt
          chance: 5

